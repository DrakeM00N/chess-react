name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонируем репозиторий
      - name: 📥 Checkout repo
        uses: actions/checkout@v3

      # 2. Устанавливаем Node 20
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 3. Чистая установка зависимостей (lockfile под Linux)
      - name: 📦 Install dependencies
        run: npm ci

      # 4. Запускаем unit тесты (Vitest)
      - name: 🧪 Run unit tests
        run: npm run test -- --run

      # 5. Устанавливаем браузеры для Playwright
      - name: 🌐 Install Playwright browsers
        run: npx playwright install --with-deps

      # 6. Запускаем E2E тесты
      # Для Playwright нужен запущенный dev-сервер:
      - name: ▶️ Start dev server
        run: npm run dev &
      - name: ⏳ Wait for dev server
        run: npx wait-on http://localhost:5173
      - name: 🤖 Run E2E tests
        run: npm run test:e2e

      # 7. Сборка проекта
      - name: 🏗 Build project
        run: npm run build